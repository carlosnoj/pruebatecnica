version: "3.8"

services:
  mongo:
    image: mongo:6
    container_name: mongo
    restart: no
    volumes:
      - mongo-data:/data/pruebatecnicadb
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    container_name: backend
    restart: no
    environment:
      - MONGO_URL=mongodb://mongo:27017/pruebatecnicadb
      - JWT_SECRET=supersecretkey
    depends_on:
      - mongo
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    container_name: frontend
    restart: no
    ports:
      - "8081:80"

  kong:
    image: kong:3.4 # o usa 'kong:latest'
    container_name: kong
    restart: no
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/kong/kong.yml"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro
    ports:
      - "8080:8000" # proxy: el gateway (lo usa el frontend/client)
      - "8001:8001" # admin API de Kong (para configuración runtime)
    depends_on:
      - backend

volumes:
  mongo-data:
